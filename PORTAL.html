<script>
    // رابط الـ Webhook لجلب البيانات في حال عدم توفرها محلياً
    const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbx.../exec";

    async function handleClientLogin(e) {
        e.preventDefault();
        const phone = document.getElementById('login-phone').value.trim();
        const pin = document.getElementById('login-pin').value.trim();
        const loginBtn = e.target.querySelector('button[type="submit"]');

        loginBtn.innerText = "جاري التحقق...";
        loginBtn.disabled = true;

        let athletes = [];
        const localData = localStorage.getItem('rush_way_athletes');
        
        if (localData) {
            athletes = JSON.parse(localData);
        }

        // البحث فقط عن هذا العميل بعينه
        const client = athletes.find(a => {
            const phoneMatch = String(a.phone).trim() === phone;
            // الرمز السري المخصص أو آخر 4 أرقام كافتراضي
            const defaultPin = phone.slice(-4);
            const pinMatch = (a.pin && String(a.pin) === pin) || (!a.pin && pin === defaultPin);
            return phoneMatch && pinMatch;
        });

        if (!client) {
            alert("بيانات الدخول غير صحيحة، أو لم يتم تفعيل حسابك بعد. يرجى مراجعة Coach Rush.");
            loginBtn.innerText = "دخول إلى خطتي 🔐";
            loginBtn.disabled = false;
            return;
        }

        // ==========================================
        // إجراءات العزل الأمني: تدمير بيانات المشتركين الآخرين من ذاكرة المتصفح
        // ==========================================
        athletes = null; // تفريغ المصفوفة فوراً من الذاكرة الحية
        
        // عرض معلومات هذا العميل فقط
        document.getElementById('view-client-name').innerText = client.name;
        document.getElementById('view-client-goal').innerText = `الهدف: ${client.goal || 'بناء كتلة عضلية وحرق الدهون'}`;
        
        // الخطة الغذائية الفردية
        document.getElementById('view-protein').innerText = client.protein || "لحم بقري صافي / سمك أبيض / بيض";
        document.getElementById('view-carbs').innerText = client.carbs || "أرز أبيض / شوفان / بطاطا";
        document.getElementById('view-fats').innerText = client.fats || "زيت زيتون، مكسرات، سلطة خضراء";
        document.getElementById('view-supps').innerText = client.supplements || "حسب الجرعات المحددة في جدولك";

        // تجهيز رابط المتابعة مع تمرير معرّف العميل تلقائياً ليملأ بياناته فقط
        const checkinLink = document.querySelector('a[href="checkin.html"]');
        if (checkinLink) {
            checkinLink.href = `checkin.html?name=${encodeURIComponent(client.name)}&phone=${encodeURIComponent(client.phone)}`;
        }

        // إخفاء واجهة الدخول وعرض لوحة العميل الخاصة
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('dashboard-view').style.display = 'block';
    }

    function handleLogout() {
        // تنظيف الشاشة والعودة لحالة تسجيل الدخول
        document.getElementById('dashboard-view').style.display = 'none';
        document.getElementById('login-view').style.display = 'block';
        document.getElementById('login-phone').value = '';
        document.getElementById('login-pin').value = '';
        window.location.reload(); // إعادة تحميل الصفحة لضمان مسح أي بيانات سابقة
    }
</script>
