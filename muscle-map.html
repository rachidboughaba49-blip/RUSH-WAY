/* ==========================================================================
   THE RUSH WAY - INTERACTIVE MUSCLE MAP STYLESHEET
   Aesthetic: Dark Navy, Black, Deep Purple, Electric Blue/Teal accents.
   Minimalist, high contrast, production-ready fitness technology.
   ========================================================================== */

.rmm-component {
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
  color: #f8fafc;
  font-family: inherit;
  box-sizing: border-box;
}

/* 1. TOPBAR & NAVIGATION */
.rmm-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  padding: 12px 18px;
  background: #141c2c;
  border: 1px solid #23324a;
  border-radius: 14px;
}

.rmm-brand-badge {
  display: flex;
  align-items: center;
  gap: 10px;
}

.rmm-pulse-beacon {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #38b2ac;
  box-shadow: 0 0 0 0 rgba(56, 178, 172, 0.7);
  animation: rmm-pulse 2s infinite;
}

@keyframes rmm-pulse {
  0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(56, 178, 172, 0.7); }
  70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(56, 178, 172, 0); }
  100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(56, 178, 172, 0); }
}

.rmm-badge-text {
  font-size: 0.88rem;
  font-weight: 700;
  color: #38b2ac;
  letter-spacing: 0.3px;
}

.rmm-modes-nav {
  display: flex;
  align-items: center;
  gap: 6px;
  background: #0b0f19;
  padding: 4px;
  border-radius: 10px;
  border: 1px solid #1f2c42;
}

.rmm-mode-tab {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 14px;
  border-radius: 8px;
  border: none;
  background: transparent;
  color: #94a3b8;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}

.rmm-mode-tab:hover {
  color: #f8fafc;
  background: rgba(255, 255, 255, 0.05);
}

.rmm-mode-tab.active {
  background: #1e2b42;
  color: #38b2ac;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(56, 178, 172, 0.3);
}

.rmm-lang-toggle {
  background: #1e2b42;
  border: 1px solid #2d3e5a;
  color: #cbd5e1;
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}

.rmm-lang-toggle:hover {
  color: #38b2ac;
  border-color: #38b2ac;
}

/* 2. MAIN 3-COLUMN WORKSPACE */
.rmm-workspace {
  display: grid;
  grid-template-columns: 1.15fr 1fr 1.35fr;
  gap: 16px;
  width: 100%;
}

@media (max-width: 1100px) {
  .rmm-workspace {
    grid-template-columns: 1fr;
  }
}

/* --- COLUMN 1: STAGE CARD (THE SVG MAP) --- */
.rmm-stage-card {
  background: #161f30;
  border: 1px solid #23324a;
  border-radius: 16px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
}

.rmm-stage-controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  margin-bottom: 12px;
  gap: 10px;
}

.rmm-view-buttons {
  display: flex;
  gap: 6px;
  background: #0b0f19;
  padding: 4px;
  border-radius: 10px;
  border: 1px solid #23324a;
}

.rmm-view-toggle {
  padding: 6px 14px;
  border-radius: 7px;
  border: none;
  background: transparent;
  color: #94a3b8;
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.18s ease;
}

.rmm-view-toggle:hover {
  color: #f8fafc;
}

.rmm-view-toggle.active {
  background: #38b2ac;
  color: #0b0f19;
}

.rmm-zoom-tools {
  display: flex;
  gap: 4px;
}

.rmm-tool-btn {
  background: #1e2b42;
  border: 1px solid #2d3e5a;
  color: #94a3b8;
  width: 32px;
  height: 32px;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s ease;
}

.rmm-tool-btn:hover {
  color: #38b2ac;
  border-color: #38b2ac;
  background: #253652;
}

.rmm-viewport {
  width: 100%;
  height: 440px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 50% 45%, #18243a 0%, #0c121e 100%);
  border: 1px solid #202d44;
  border-radius: 14px;
  overflow: hidden;
  position: relative;
}

.rmm-canvas {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  transform-origin: center center;
}

.rmm-anatomical-svg {
  width: auto;
  height: 94%;
  max-width: 90%;
  user-select: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.rmm-anatomical-svg.hidden {
  display: none;
  opacity: 0;
}

.rmm-anatomical-svg.active {
  display: block;
  opacity: 1;
}

/* SVG MUSCLE PATH INTERACTION STATES */
.rmm-muscle {
  fill: #1e2a3e;
  stroke: #2e415e;
  stroke-width: 1px;
  stroke-linejoin: round;
  cursor: pointer;
  transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
  outline: none;
}

.rmm-muscle:hover {
  fill: #2c3e5c;
  stroke: #38b2ac;
  stroke-width: 1.5px;
  filter: drop-shadow(0 0 5px rgba(56, 178, 172, 0.6));
}

.rmm-muscle:focus-visible {
  stroke: #38b2ac;
  stroke-width: 2px;
  filter: drop-shadow(0 0 8px rgba(56, 178, 172, 0.9));
}

.rmm-muscle.selected {
  fill: #38b2ac !important;
  stroke: #e6fffa !important;
  stroke-width: 1.8px !important;
  filter: drop-shadow(0 0 10px rgba(56, 178, 172, 0.95)) !important;
}

/* TARGETING HIGHLIGHT STATES */
.rmm-muscle.is-primary {
  fill: #0ea5e9 !important;
  stroke: #e0f2fe !important;
  stroke-width: 1.8px !important;
  filter: drop-shadow(0 0 10px rgba(14, 165, 233, 0.95)) !important;
}

.rmm-muscle.is-secondary {
  fill: #8b5cf6 !important;
  stroke: #ede9fe !important;
  stroke-width: 1.6px !important;
  filter: drop-shadow(0 0 8px rgba(139, 92, 246, 0.9)) !important;
}

.rmm-muscle.is-stabilizer {
  fill: #f59e0b !important;
  stroke: #fef3c7 !important;
  stroke-width: 1.5px !important;
  filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.85)) !important;
}

.rmm-muscle.is-dimmed {
  opacity: 0.28;
  filter: grayscale(85%);
}

/* ASSESSMENT HIGHLIGHT STATES */
.rmm-muscle.assessment-priority {
  fill: #ef4444 !important;
  stroke: #fecaca !important;
  stroke-width: 1.8px !important;
  filter: drop-shadow(0 0 10px rgba(239, 68, 68, 0.9)) !important;
}

.rmm-muscle.assessment-weak {
  fill: #f59e0b !important;
  stroke: #fef08a !important;
  stroke-width: 1.8px !important;
  filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.9)) !important;
}

.rmm-muscle.assessment-balanced {
  fill: #10b981 !important;
  stroke: #d1fae5 !important;
  stroke-width: 1.6px !important;
  filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.9)) !important;
}

.rmm-muscle.assessment-attention {
  fill: #8b5cf6 !important;
  stroke: #ede9fe !important;
  stroke-width: 1.8px !important;
  filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.9)) !important;
}

/* LEGEND & QUICK REGIONS */
.rmm-legend-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  width: 100%;
  padding: 10px 14px;
  margin-top: 10px;
  background: #0f1624;
  border-radius: 10px;
  border: 1px solid #1f2c42;
  font-size: 0.78rem;
  color: #94a3b8;
}

.rmm-legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.rmm-legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.rmm-legend-dot.primary { background: #0ea5e9; box-shadow: 0 0 6px #0ea5e9; }
.rmm-legend-dot.secondary { background: #8b5cf6; box-shadow: 0 0 6px #8b5cf6; }
.rmm-legend-dot.stabilizer { background: #f59e0b; box-shadow: 0 0 6px #f59e0b; }
.rmm-legend-dot.selected { background: #38b2ac; box-shadow: 0 0 6px #38b2ac; }
.rmm-legend-dot.default { background: #2e415e; }

.rmm-quick-regions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  width: 100%;
  margin-top: 10px;
}

.rmm-chip-btn {
  background: #141d2d;
  border: 1px solid #23324a;
  color: #94a3b8;
  padding: 5px 10px;
  border-radius: 7px;
  font-size: 0.78rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.18s ease;
}

.rmm-chip-btn:hover {
  background: #1e2b42;
  color: #38b2ac;
  border-color: #38b2ac;
}

/* --- COLUMN 2: DOSSIER CARD (MUSCLE / TARGETING INFO) --- */
.rmm-dossier-card {
  background: #161f30;
  border: 1px solid #23324a;
  border-radius: 16px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
}

.rmm-dossier-header {
  border-bottom: 1px solid #22314a;
  padding-bottom: 14px;
}

.rmm-region-tag {
  display: inline-block;
  font-size: 0.75rem;
  font-weight: 700;
  color: #38b2ac;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  background: rgba(56, 178, 172, 0.12);
  border: 1px solid rgba(56, 178, 172, 0.3);
  padding: 3px 8px;
  border-radius: 6px;
  margin-bottom: 6px;
}

.rmm-dossier-title {
  font-size: 1.25rem;
  font-weight: 800;
  color: #f8fafc;
  line-height: 1.3;
}

.rmm-dossier-sub {
  font-size: 0.85rem;
  color: #94a3b8;
  margin-top: 3px;
}

.rmm-biomech-box {
  background: #0f1624;
  border: 1px solid #1f2c42;
  border-radius: 12px;
  padding: 14px;
}

.rmm-biomech-box .label {
  font-size: 0.8rem;
  font-weight: 700;
  color: #cbd5e1;
  margin-bottom: 6px;
}

.rmm-biomech-box p {
  font-size: 0.85rem;
  color: #94a3b8;
  line-height: 1.5;
}

.rmm-actions-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed #1e2b42;
}

.rmm-action-pill {
  font-size: 0.78rem;
  color: #38b2ac;
}

.rmm-stats-summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.rmm-stat-item {
  background: #111827;
  border: 1px solid #1f2c42;
  border-radius: 10px;
  padding: 10px;
  text-align: center;
}

.rmm-stat-item .num {
  display: block;
  font-size: 1.25rem;
  font-weight: 800;
  color: #38b2ac;
}

.rmm-stat-item .lbl {
  font-size: 0.72rem;
  color: #94a3b8;
}

.rmm-targeting-breakdown {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.rmm-breakdown-group h4 {
  font-size: 0.8rem;
  font-weight: 700;
  color: #cbd5e1;
  margin-bottom: 6px;
}

.rmm-tag-cloud {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.rmm-muscle-tag {
  border: none;
  font-size: 0.75rem;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.18s ease;
}

.rmm-muscle-tag.primary {
  background: rgba(14, 165, 233, 0.18);
  color: #38bdf8;
  border: 1px solid rgba(14, 165, 233, 0.35);
}

.rmm-muscle-tag.secondary {
  background: rgba(139, 92, 246, 0.18);
  color: #c084fc;
  border: 1px solid rgba(139, 92, 246, 0.35);
}

.rmm-muscle-tag.stabilizer {
  background: rgba(245, 158, 11, 0.18);
  color: #fbbf24;
  border: 1px solid rgba(245, 158, 11, 0.35);
}

.rmm-muscle-tag:hover {
  transform: translateY(-1px);
  filter: brightness(1.2);
}

.rmm-dossier-actions {
  display: flex;
  gap: 10px;
  margin-top: auto;
}

.rmm-btn-primary {
  flex: 1;
  background: #38b2ac;
  color: #0b0f19;
  border: none;
  padding: 10px 18px;
  border-radius: 9px;
  font-weight: 700;
  font-size: 0.88rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.rmm-btn-primary:hover {
  background: #319795;
  box-shadow: 0 4px 12px rgba(56, 178, 172, 0.35);
}

.rmm-btn-secondary {
  flex: 1;
  background: #1e2b42;
  color: #cbd5e1;
  border: 1px solid #2e415e;
  padding: 10px 18px;
  border-radius: 9px;
  font-weight: 700;
  font-size: 0.88rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.rmm-btn-secondary:hover {
  background: #253652;
  color: #38b2ac;
  border-color: #38b2ac;
}

/* ASSESSMENT CONSOLE */
.rmm-status-options {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: 6px;
}

.rmm-status-btn {
  background: #0f1624;
  border: 1px solid #1f2c42;
  color: #94a3b8;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 0.78rem;
  font-weight: 600;
  cursor: pointer;
  text-align: start;
  transition: all 0.18s ease;
}

.rmm-status-btn:hover {
  border-color: #38b2ac;
  color: #f8fafc;
}

.rmm-status-btn.active.priority { background: rgba(239, 68, 68, 0.2); border-color: #ef4444; color: #fca5a5; }
.rmm-status-btn.active.weak { background: rgba(245, 158, 11, 0.2); border-color: #f59e0b; color: #fde047; }
.rmm-status-btn.active.balanced { background: rgba(16, 185, 129, 0.2); border-color: #10b981; color: #86efac; }
.rmm-status-btn.active.attention { background: rgba(139, 92, 246, 0.2); border-color: #8b5cf6; color: #c4b5fd; }

.rmm-form-label {
  font-size: 0.8rem;
  font-weight: 700;
  color: #cbd5e1;
  display: block;
}

.rmm-textarea {
  width: 100%;
  background: #0f1624;
  border: 1px solid #23324a;
  border-radius: 8px;
  padding: 8px 12px;
  color: #f8fafc;
  font-family: inherit;
  font-size: 0.82rem;
  resize: vertical;
  box-sizing: border-box;
}

.rmm-textarea:focus {
  outline: none;
  border-color: #38b2ac;
  box-shadow: 0 0 0 1px #38b2ac;
}

/* --- COLUMN 3: EXERCISES CARD --- */
.rmm-exercises-card {
  background: #161f30;
  border: 1px solid #23324a;
  border-radius: 16px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
}

.rmm-exercise-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #22314a;
  padding-bottom: 12px;
}

.rmm-ex-title-wrap h3 {
  font-size: 1.15rem;
  font-weight: 800;
  color: #f8fafc;
}

.rmm-ex-title-wrap p {
  font-size: 0.78rem;
  color: #94a3b8;
  margin-top: 2px;
}

.rmm-count-badge {
  background: #1e2b42;
  border: 1px solid #2e415e;
  color: #38b2ac;
  font-size: 0.75rem;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 8px;
}

.rmm-exercise-search-box {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.rmm-search-input-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #0f1624;
  border: 1px solid #23324a;
  border-radius: 10px;
  padding: 8px 12px;
  color: #94a3b8;
}

.rmm-search-input-wrap input {
  background: transparent;
  border: none;
  outline: none;
  color: #f8fafc;
  font-family: inherit;
  font-size: 0.85rem;
  width: 100%;
}

.rmm-equip-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.rmm-equip-pill {
  background: #141d2d;
  border: 1px solid #1f2c42;
  color: #94a3b8;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 0.75rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.18s ease;
}

.rmm-equip-pill:hover {
  color: #f8fafc;
  background: #1e2b42;
}

.rmm-equip-pill.active {
  background: #38b2ac;
  color: #0b0f19;
  border-color: #38b2ac;
}

.rmm-exercise-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: 480px;
  overflow-y: auto;
  padding-right: 4px;
}

.rmm-exercise-list::-webkit-scrollbar {
  width: 5px;
}

.rmm-exercise-list::-webkit-scrollbar-thumb {
  background: #23324a;
  border-radius: 4px;
}

.rmm-ex-card {
  background: #111827;
  border: 1px solid #1f2c42;
  border-radius: 12px;
  padding: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.rmm-ex-card:hover {
  background: #182338;
  border-color: #2d4160;
  transform: translateY(-1px);
}

.rmm-ex-card.active {
  background: #14283c;
  border-color: #38b2ac;
  box-shadow: 0 4px 14px rgba(56, 178, 172, 0.2);
}

.rmm-ex-card-main {
  flex: 1;
}

.rmm-ex-meta-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}

.rmm-equip-badge {
  font-size: 0.68rem;
  font-weight: 700;
  background: #1e2b42;
  color: #94a3b8;
  padding: 2px 6px;
  border-radius: 4px;
}

.rmm-tier-tag {
  font-size: 0.68rem;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
}

.rmm-tier-tag.primary { background: rgba(14, 165, 233, 0.2); color: #38bdf8; }
.rmm-tier-tag.secondary { background: rgba(139, 92, 246, 0.2); color: #c084fc; }
.rmm-tier-tag.stabilizer { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }

.rmm-ex-title {
  font-size: 0.95rem;
  font-weight: 700;
  color: #f8fafc;
}

.rmm-ex-sub {
  font-size: 0.78rem;
  color: #94a3b8;
}

.rmm-ex-details {
  display: flex;
  gap: 10px;
  font-size: 0.74rem;
  color: #64748b;
  margin-top: 6px;
}

.rmm-ex-card-actions {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

  };

  // 17 ARCHITECTURAL STABLE CANONICAL IDS
  const STABLE_MUSCLE_IDS = [
    'pectoralis_major_upper',

    'obliques',

    'hamstrings',

    'gastrocnemius',
    'soleus'
  ];

  // Helper lookups
  const muscleMap = new Map();
  const canonicalMap = new Map();

  MUSCLES.forEach(m => {
    muscleMap.set(m.id, m);
    if (m.groupKey && !canonicalMap.has(m.groupKey)) {
      canonicalMap.set(m.groupKey, m);
    }
    if (m.aliases && Array.isArray(m.aliases)) {
      m.aliases.forEach(a => {
        if (!canonicalMap.has(a)) canonicalMap.set(a, m);
      });
    }
  });

  // Explicit mappings for all 17 required stable keys
  canonicalMap.set('pectoralis_major_middle', muscleMap.get('pectoralis_major_mid_l') || muscleMap.get('pectoralis_major_mid_r'));
  canonicalMap.set('pectoralis_major_mid', muscleMap.get('pectoralis_major_mid_l') || muscleMap.get('pectoralis_major_mid_r'));
  canonicalMap.set('pectoralis_major_upper', muscleMap.get('pectoralis_major_upper_l'));
  canonicalMap.set('pectoralis_major_lower', muscleMap.get('pectoralis_major_lower_l'));

  canonicalMap.set('posterior_deltoid', muscleMap.get('posterior_deltoid_l'));

  canonicalMap.set('rectus_abdominis', muscleMap.get('rectus_abdominis_upper'));
  canonicalMap.set('obliques', muscleMap.get('external_obliques_l') || muscleMap.get('external_obliques_r'));
  canonicalMap.set('external_obliques', muscleMap.get('external_obliques_l') || muscleMap.get('external_obliques_r'));
  canonicalMap.set('quadriceps', muscleMap.get('quadriceps_l') || muscleMap.get('quadriceps_r'));
  canonicalMap.set('hamstrings', muscleMap.get('hamstrings_l') || muscleMap.get('hamstrings_r'));
  canonicalMap.set('gluteus_maximus', muscleMap.get('gluteus_maximus_l'));
  canonicalMap.set('gastrocnemius', muscleMap.get('gastrocnemius_l') || muscleMap.get('gastrocnemius_r'));
  canonicalMap.set('soleus', muscleMap.get('soleus_l'));

  const exerciseMap = new Map();
  EXERCISES.forEach(e => exerciseMap.set(e.id, e));

  return {
    REGIONS,
    MUSCLES,
    EXERCISES,
    ASSESSMENT_LEVELS,
    STABLE_MUSCLE_IDS,
    getMuscleById: (id) => {
      if (!id) return null;
      if (muscleMap.has(id)) return muscleMap.get(id);
      if (canonicalMap.has(id)) return canonicalMap.get(id);
      const clean = String(id).toLowerCase().replace(/[- ]/g, '_');
      if (canonicalMap.has(clean)) return canonicalMap.get(clean);
      return null;
    },
    getExerciseById: (id) => exerciseMap.get(id),
    getMusclesByView: (view) => MUSCLES.filter(m => m.view === view),
    getMusclesByRegion: (region) => MUSCLES.filter(m => m.region === region),
        getExercisesForMuscle: (muscleId) => {
      const primary = [];
      const secondary = [];
      const stabilizer = [];

      const target = (muscleMap.get(muscleId) || canonicalMap.get(muscleId));
      const matchIds = new Set([muscleId]);
      if (target) {
        if (target.pairedWith) matchIds.add(target.pairedWith);
        if (target.groupKey) matchIds.add(target.groupKey);
      }

      EXERCISES.forEach(ex => {
        const isPri = ex.primaryMuscles && ex.primaryMuscles.some(id => matchIds.has(id));
        const isSec = !isPri && ex.secondaryMuscles && ex.secondaryMuscles.some(id => matchIds.has(id));
        const isStab = !isPri && !isSec && ex.stabilizingMuscles && ex.stabilizingMuscles.some(id => matchIds.has(id));

        if (isPri) {
          primary.push(ex);
        } else if (isSec) {
          secondary.push(ex);
        } else if (isStab) {
          stabilizer.push(ex);
        }
      });

      return { primary, secondary, stabilizer, total: primary.length + secondary.length + stabilizer.length };
    }
  };

    // --- EVENTS BINDING ---
    bindEvents() {
      const root = document.getElementById(this.containerId);
      if (!root) return;

      // Mode tabs
      root.querySelectorAll('.rmm-mode-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          const m = btn.dataset.mode;
          this.setMode(m);
        });
      });

      // View toggle
      root.querySelectorAll('.rmm-view-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
          this.switchView(btn.dataset.view);
        });
      });

      // Zoom controls
      const btnZoomIn = document.getElementById('rmm-btn-zoom-in');
      const btnZoomOut = document.getElementById('rmm-btn-zoom-out');
      const btnZoomReset = document.getElementById('rmm-btn-zoom-reset');

      if (btnZoomIn) btnZoomIn.onclick = () => this.adjustZoom(0.2);
      if (btnZoomOut) btnZoomOut.onclick = () => this.adjustZoom(-0.2);
      if (btnZoomReset) btnZoomReset.onclick = () => this.resetZoom();

      // Language toggle
      const btnLang = document.getElementById('rmm-btn-lang-toggle');
      if (btnLang) {
        btnLang.onclick = () => {
          this.setLanguage(this.lang === 'ar' ? 'en' : 'ar');
        };
      }

      // Region quick chips
      root.querySelectorAll('.rmm-chip-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const region = btn.dataset.region;
          const muscles = MuscleData.getMusclesByRegion(region);
          if (muscles && muscles.length > 0) {
            const firstInView = muscles.find(m => m.view === this.view) || muscles[0];
            if (firstInView.view !== this.view) {
              this.switchView(firstInView.view);
            }
            this.selectMuscle(firstInView.id);
          }
        });
      });

      // Equipment filter pills
      root.querySelectorAll('.rmm-equip-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          root.querySelectorAll('.rmm-equip-pill').forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          this.equipmentFilter = pill.dataset.filter;
          this.renderExerciseList();
        });
      });

      // Live search input
      const searchInput = document.getElementById('rmm-exercise-search');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          this.searchQuery = (e.target.value || '').trim().toLowerCase();
          this.renderExerciseList();
        });
      }

      // Muscle SVG hover & click events (Delegated)
      root.querySelectorAll('.rmm-muscle').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          const muscleId = el.dataset.muscleId;
          if (muscleId) {
            if (this.mode === 'targeting') {
              this.setMode('selection');
            }
            this.selectMuscle(muscleId);
          }
        });

        // Accessibility keydown (Enter / Space)
        el.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            const muscleId = el.dataset.muscleId;
            if (muscleId) this.selectMuscle(muscleId);
          }
        });
      });
    }

    // --- ZOOM LOGIC ---
    adjustZoom(delta) {
      this.zoomLevel = Math.min(Math.max(0.8, this.zoomLevel + delta), 2.2);
      this.applyZoom();
    }

    resetZoom() {
      this.zoomLevel = 1.0;
      this.applyZoom();
    }

    applyZoom() {
      const canvas = document.getElementById('rmm-canvas');
      if (canvas) {
        canvas.style.transform = `scale(${this.zoomLevel})`;
      }
    }

    // --- VIEW & MODE SWITCHING ---
    switchView(targetView) {
      if (targetView !== 'front' && targetView !== 'back') return;
      this.view = targetView;

      const root = document.getElementById(this.containerId);
      if (root) {
        root.querySelectorAll('.rmm-view-toggle').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.view === targetView);
        });

        const svgFront = document.getElementById('rmm-svg-front');
        const svgBack = document.getElementById('rmm-svg-back');
        if (svgFront) {
          svgFront.classList.toggle('active', targetView === 'front');
          svgFront.classList.toggle('hidden', targetView !== 'front');
        }
        if (svgBack) {
          svgBack.classList.toggle('active', targetView === 'back');
          svgBack.classList.toggle('hidden', targetView !== 'back');
        }
      }

      this.renderQuickRegions();
      this.bindQuickRegions();
      this.updateViewVisuals();
    }

    bindQuickRegions() {
      const root = document.getElementById(this.containerId);
      if (!root) return;
      root.querySelectorAll('.rmm-chip-btn').forEach(btn => {
        btn.onclick = () => {
          const region = btn.dataset.region;
          const muscles = MuscleData.getMusclesByRegion(region);
          if (muscles && muscles.length > 0) {
            const firstInView = muscles.find(m => m.view === this.view) || muscles[0];
            if (firstInView.view !== this.view) {
              this.switchView(firstInView.view);
            }
            this.selectMuscle(firstInView.id);
          }
        };
      });
    }

    setMode(newMode) {
      if (!['selection', 'targeting', 'assessment'].includes(newMode)) return;
      this.mode = newMode;

      const root = document.getElementById(this.containerId);
      if (root) {
        root.querySelectorAll('.rmm-mode-tab').forEach(t => {
          t.classList.toggle('active', t.dataset.mode === newMode);
        });
      }

      this.renderLegend();

      if (newMode === 'targeting') {
        if (!this.selectedExerciseId) {
          const firstEx = MuscleData.EXERCISES[0];
          if (firstEx) this.selectExercise(firstEx.id);
        } else {
          this.applyExerciseTargeting(this.selectedExerciseId);
        }
      } else if (newMode === 'assessment') {
        this.updateAssessmentVisuals();
        this.renderAssessmentPanel();
      } else {
        // Selection mode
        this.clearAllTargetingHighlights();
        this.selectMuscle(this.selectedMuscleId, false);
      }
    }

    // --- MUSCLE SELECTION ---
    selectMuscle(muscleId, triggerCallback = true) {
      const muscle = MuscleData.getMuscleById(muscleId);
      if (!muscle) return;

      this.selectedMuscleId = muscleId;

      // Auto-switch view if muscle is in opposite view
      if (muscle.view !== this.view) {
        this.switchView(muscle.view);
      }

      // Highlight selected muscle (and pair if desired)
      this.updateMuscleHighlight(muscleId);

      // Render side dossier and filtered exercises
      this.renderSidePanel();
      this.renderExerciseList();

      if (triggerCallback && typeof this.onMuscleSelected === 'function') {
        this.onMuscleSelected(muscle);
      }
    }

        updateMuscleHighlight(activeId) {
      const root = document.getElementById(this.containerId);
      if (!root) return;

      const activeMuscle = MuscleData.getMuscleById(activeId);
      const pairedId = activeMuscle ? activeMuscle.pairedWith : null;

      root.querySelectorAll('.rmm-muscle').forEach(el => {
        const id = el.dataset.muscleId;
        const isSelected = (id === activeId || (pairedId && id === pairedId));
        el.classList.toggle('selected', isSelected);
      });

      if (activeMuscle && activeMuscle.region) {
        root.querySelectorAll('.rmm-chip-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.region === activeMuscle.region);
        });
      }
    }

    // --- EXERCISE TARGETING MODE ---
    selectExercise(exerciseId) {
      const ex = MuscleData.getExerciseById(exerciseId);
      if (!ex) return;

      this.selectedExerciseId = exerciseId;
      this.mode = 'targeting';

      const root = document.getElementById(this.containerId);
      if (root) {
        root.querySelectorAll('.rmm-mode-tab').forEach(t => {
          t.classList.toggle('active', t.dataset.mode === 'targeting');
        });
      }

      this.renderLegend();
      this.applyExerciseTargeting(exerciseId);
      this.renderSidePanel();
      this.renderExerciseList();

      if (typeof this.onExerciseSelected === 'function') {
        this.onExerciseSelected(ex);
      }
    }

    applyExerciseTargeting(exerciseId) {
      const ex = MuscleData.getExerciseById(exerciseId);
      if (!ex) return;

      const root = document.getElementById(this.containerId);
      if (!root) return;

      // Check if primary muscles are mainly in the other view
      const firstPrimary = ex.primaryMuscles[0] ? MuscleData.getMuscleById(ex.primaryMuscles[0]) : null;
      if (firstPrimary && firstPrimary.view !== this.view) {
        this.switchView(firstPrimary.view);
      }

      root.querySelectorAll('.rmm-muscle').forEach(el => {
        const id = el.dataset.muscleId;
        el.classList.remove('selected', 'is-primary', 'is-secondary', 'is-stabilizer', 'is-dimmed');

        if (ex.primaryMuscles.includes(id)) {
          el.classList.add('is-primary');
        } else if (ex.secondaryMuscles.includes(id)) {
          el.classList.add('is-secondary');
        } else if (ex.stabilizingMuscles.includes(id)) {
          el.classList.add('is-stabilizer');
        } else {
          el.classList.add('is-dimmed');
        }
      });
    }

    clearAllTargetingHighlights() {
      const root = document.getElementById(this.containerId);
      if (!root) return;
      root.querySelectorAll('.rmm-muscle').forEach(el => {
        el.classList.remove('is-primary', 'is-secondary', 'is-stabilizer', 'is-dimmed');
      });
    }

    updateViewVisuals() {
      if (this.mode === 'targeting' && this.selectedExerciseId) {
        this.applyExerciseTargeting(this.selectedExerciseId);
      } else if (this.mode === 'assessment') {
        this.updateAssessmentVisuals();
      } else {
        this.updateMuscleHighlight(this.selectedMuscleId);
      }
    }

    updateAssessmentVisuals() {
      const root = document.getElementById(this.containerId);
      if (!root) return;

      const athleteAssessments = this.getAthleteAssessments(this.selectedAthleteId);

      root.querySelectorAll('.rmm-muscle').forEach(el => {
        const id = el.dataset.muscleId;
        el.classList.remove('assessment-priority', 'assessment-weak', 'assessment-balanced', 'assessment-attention');

        const record = athleteAssessments[id];
        if (record && record.status) {
          el.classList.add(`assessment-${record.status}`);
        }
      });
    }

                  }).join('')}
                </div>
              </div>
            ` : ''}

            ${ex.stabilizingMuscles.length > 0 ? `
              <div class="rmm-breakdown-group stabilizer">
                <h4>🛡️ ${isAr ? 'المثبتات والموازنات (Stabilizers)' : 'Stabilizers'}</h4>

                  ${ex.stabilizingMuscles.map(id => {
                    const m = MuscleData.getMuscleById(id);

              </div>

            <button type="button" class="rmm-btn-primary" id="rmm-btn-open-add-dialog">

              <span>${isAr ? 'إدراج في البرنامج التدريبي' : 'Add to Workout Program'}</span>
            </button>

      panel.innerHTML = `
        <div class="rmm-dossier-header">
          <span class="rmm-region-tag">${isAr ? regionObj.ar : regionObj.en}</span>
          <h3 class="rmm-dossier-title">${isAr ? muscle.displayNameAr : muscle.displayName}</h3>
          <div class="rmm-dossier-sub">${isAr ? muscle.nameAr : muscle.name}</div>
        </div>

        <div class="rmm-biomech-box">
          <div class="label">⚙️ ${isAr ? 'الوظيفة الحركية والميكانيكية الحيوية:' : 'Anatomical Function & Joint Actions:'}</div>
          <p>${isAr ? muscle.functionAr : muscle.functionEn}</p>
          <div class="rmm-actions-list">
            ${muscle.jointActions.map(action => `<span class="rmm-action-pill">• ${action}</span>`).join('')}
          </div>

        <div class="rmm-stats-summary">
          <div class="rmm-stat-item">
            <span class="num">${rels.primary.length}</span>
            <span class="lbl">${isAr ? 'تمارين أساسية' : 'Primary'}</span>
          </div>
          <div class="rmm-stat-item">
            <span class="num">${rels.secondary.length}</span>

          <button type="button" class="rmm-btn-secondary" id="rmm-btn-switch-targeting-mode">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>

    bindDossierEvents(panel) {
      const isAr = this.lang === 'ar';
      panel.querySelectorAll('.rmm-muscle-tag').forEach(tag => {
        tag.onclick = () => {
          const mid = tag.dataset.mid;
          if (mid) this.selectMuscle(mid);
        };
      });

      const btnAdd = panel.querySelector('#rmm-btn-open-add-dialog');
      if (btnAdd && this.selectedExerciseId) {
        btnAdd.onclick = () => {
          this.openWorkoutAddModal(this.selectedExerciseId);
        };
      }

      const btnSwitchTarget = panel.querySelector('#rmm-btn-switch-targeting-mode');
      if (btnSwitchTarget) {
        btnSwitchTarget.onclick = () => {
          const rels = MuscleData.getExercisesForMuscle(this.selectedMuscleId);
          if (rels.primary.length > 0) {
            this.selectExercise(rels.primary[0].id);
          } else if (rels.total > 0) {
            const anyEx = rels.secondary[0] || rels.stabilizer[0];
            this.selectExercise(anyEx.id);
          }
        };
      }
    }

    // --- ASSESSMENT MODE PANEL ---
    renderAssessmentPanel() {
      const panel = document.getElementById('rmm-dossier-card');
      if (!panel) return;

      const isAr = this.lang === 'ar';
      const muscle = MuscleData.getMuscleById(this.selectedMuscleId) || MuscleData.MUSCLES[0];
      const athleteAssessments = this.getAthleteAssessments(this.selectedAthleteId);
      const currentRecord = athleteAssessments[muscle.id] || { status: '', note: '' };

      panel.innerHTML = `
        <div class="rmm-dossier-header">
          <span class="rmm-region-tag" style="color: #f59e0b; border-color: rgba(245,158,11,0.4);">${isAr ? 'تقييم المتدرب البدني' : 'Client Assessment Console'}</span>
          <h3 class="rmm-dossier-title">${isAr ? muscle.displayNameAr : muscle.displayName}</h3>

        <div class="rmm-assessment-form">

            <button type="button" class="rmm-status-btn weak ${currentRecord.status === 'weak' ? 'active' : ''}" data-status="weak">
              🟠 ${isAr ? 'نقطة ضعف / متأخرة' : 'Lagging / Weak'}
            </button>
            <button type="button" class="rmm-status-btn balanced ${currentRecord.status === 'balanced' ? 'active' : ''}" data-status="balanced">
              🟢 ${isAr ? 'متناسقة ومثالية' : 'Balanced / Good'}
            </button>
            <button type="button" class="rmm-status-btn attention ${currentRecord.status === 'attention' ? 'active' : ''}" data-status="attention">
              🟣 ${isAr ? 'تحتاج مرونة وتأهيل' : 'Mobility / Attention'}

          <label class="rmm-form-label" style="margin-top: 14px;">${isAr ? 'ملاحظة المدرب وتوصيات الحجم التدريبي:' : 'Coach Observation & Volume Prescription:'}</label>
          <textarea id="rmm-assessment-note" class="rmm-textarea" rows="3" placeholder="${isAr ? 'مثال: تحتاج إلى مجموعتين إضافيتين أسبوعياً مع التركيز على الإطالة تحت الحمل...' : 'e.g., Needs 2 extra direct sets weekly with loaded stretch emphasis...'}">${currentRecord.note || ''}</textarea>

          <div class="rmm-dossier-actions" style="margin-top: 16px;">
            <button type="button" class="rmm-btn-primary" id="rmm-btn-save-assessment">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              <span>${isAr ? 'حفظ التقييم للمتدرب' : 'Save Observation'}</span>
            </button>
            ${currentRecord.status ? `
              <button type="button" class="rmm-btn-secondary" id="rmm-btn-clear-assessment" style="color: #ef4444;">
                <span>${isAr ? 'مسح التقييم' : 'Clear'}</span>
              </button>
            ` : ''}
          </div>
        </div>
      `;

      let selectedStatus = currentRecord.status;
      panel.querySelectorAll('.rmm-status-btn').forEach(btn => {
        btn.onclick = () => {
          panel.querySelectorAll('.rmm-status-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedStatus = btn.dataset.status;
        };

      if (btnSave) {
        btnSave.onclick = () => {
          const note = (panel.querySelector('#rmm-assessment-note')?.value || '').trim();
          this.setMuscleAssessment(this.selectedAthleteId || 'global_athlete', muscle.id, selectedStatus, note);
          this.showToast(isAr ? `تم حفظ تقييم "${muscle.displayNameAr}" بنجاح!` : `Saved observation for ${muscle.displayName}`);

      if (btnClear) {
        btnClear.onclick = () => {
          this.setMuscleAssessment(this.selectedAthleteId || 'global_athlete', muscle.id, null);
          this.showToast(isAr ? 'تم مسح التقييم.' : 'Assessment cleared.');
        };
      }
    }

    // --- EXERCISE LIST RENDERING & FILTERING ---
    renderExerciseList() {
      const header = document.getElementById('rmm-exercise-header');
      const listContainer = document.getElementById('rmm-exercise-list');
      if (!header || !listContainer) return;

      const isAr = this.lang === 'ar';
      const muscle = MuscleData.getMuscleById(this.selectedMuscleId);
      const rels = muscle ? MuscleData.getExercisesForMuscle(muscle.id) : { primary: [], secondary: [], stabilizer: [] };

      // Determine candidate exercises
      let candidates = [];
      if (this.mode === 'targeting' && this.selectedExerciseId) {
        // Show all exercises with selected one highlighted at top
        candidates = [...MuscleData.EXERCISES];
      } else {
        // Exercises that have any relationship with the selected muscle
        const rawCandidates = [...rels.primary, ...rels.secondary, ...rels.stabilizer];
        const seenCandidateIds = new Set();
        candidates = rawCandidates.filter(c => {
          if (seenCandidateIds.has(c.id)) return false;
          seenCandidateIds.add(c.id);
          return true;
        });
        // If query is present and no relationship, search entire database
        if (this.searchQuery && candidates.length === 0) {
          candidates = [...MuscleData.EXERCISES];
        }
      }

      // Filter by equipment
      if (this.equipmentFilter !== 'all') {
        candidates = candidates.filter(ex => ex.equipment === this.equipmentFilter);
      }

      // Filter by search query
      if (this.searchQuery) {
        candidates = candidates.filter(ex => {
          return ex.name.toLowerCase().includes(this.searchQuery) ||
                 (ex.nameAr && ex.nameAr.includes(this.searchQuery)) ||
                 ex.equipment.toLowerCase().includes(this.searchQuery);
        });
      }

      header.innerHTML = `
        <div class="rmm-ex-title-wrap">
          <h3>${isAr ? 'التمارين المستهدفة' : 'Targeted Exercises'}</h3>
          <p>${muscle ? (isAr ? `تمارين موجهة لعضلة: ${muscle.displayNameAr}` : `Focus: ${muscle.displayName}`) : ''}</p>
        </div>
        <span class="rmm-count-badge">${candidates.length} ${isAr ? 'تمرين' : 'Exercises'}</span>
      `;

      if (candidates.length === 0) {
        listContainer.innerHTML = `
          <div class="rmm-empty-state">
            <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            <p>${isAr ? 'لا توجد تمارين مطابقة للتصفية الحالية.' : 'No exercises match current filters.'}</p>
          </div>
        `;
        return;
      }

      listContainer.innerHTML = candidates.map(ex => {
        const isPrimary = ex.primaryMuscles.includes(this.selectedMuscleId);
        const isSecondary = ex.secondaryMuscles.includes(this.selectedMuscleId);
        const isStabilizer = ex.stabilizingMuscles.includes(this.selectedMuscleId);
        const isTargetActive = (this.selectedExerciseId === ex.id && this.mode === 'targeting');

        let tierBadge = '';
        if (isPrimary) {
          tierBadge = `<span class="rmm-tier-tag primary">${isAr ? '🎯 محرك أساسي' : 'Primary'}</span>`;
        } else if (isSecondary) {
          tierBadge = `<span class="rmm-tier-tag secondary">${isAr ? '⚡ مساعد ثانوي' : 'Secondary'}</span>`;
        } else if (isStabilizer) {
          tierBadge = `<span class="rmm-tier-tag stabilizer">${isAr ? '🛡️ مثبت' : 'Stabilizer'}</span>`;
        }

        return `
          <div class="rmm-ex-card ${isTargetActive ? 'active' : ''}" data-eid="${ex.id}">
            <div class="rmm-ex-card-main">
              <div class="rmm-ex-meta-row">
                <span class="rmm-equip-badge">${ex.equipment.toUpperCase()}</span>
                ${tierBadge}
              </div>
              <h4 class="rmm-ex-title">${isAr ? ex.nameAr : ex.name}</h4>
              <div class="rmm-ex-sub">${isAr ? ex.name : ex.nameAr}</div>
              <div class="rmm-ex-details">
                <span>⚙️ ${ex.defaultSets} × ${ex.defaultReps}</span>
                <span>⏱️ ${ex.defaultRestSec}s</span>
                <span>🔥 RPE ${ex.defaultRpe}</span>
              </div>
            </div>

            <div class="rmm-ex-card-actions">
              <button type="button" class="rmm-btn-target-preview" data-eid="${ex.id}" title="${isAr ? 'عرض الاستهداف على المجسم' : 'Preview targeting on Muscle Map'}">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
                <span>${isAr ? 'استهداف' : 'Target'}</span>
              </button>
              <button type="button" class="rmm-btn-add-routine" data-eid="${ex.id}">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
                <span>${isAr ? 'إضافة' : 'Add'}</span>
              </button>
            </div>
          </div>
        `;
      }).join('');

      // Bind card interactions
      listContainer.querySelectorAll('.rmm-btn-target-preview').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const eid = btn.dataset.eid;
          if (eid) this.selectExercise(eid);
        };
      });

      listContainer.querySelectorAll('.rmm-btn-add-routine').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const eid = btn.dataset.eid;
          if (eid) this.openWorkoutAddModal(eid);
        };
      });

      listContainer.querySelectorAll('.rmm-ex-card').forEach(card => {
        card.onclick = () => {
          const eid = card.dataset.eid;
          if (eid) this.selectExercise(eid);
        };
      });
    }

    // --- WORKOUT BUILDER INTEGRATION MODAL ---
    openWorkoutAddModal(exerciseId) {
      const ex = MuscleData.getExerciseById(exerciseId);
      if (!ex) return;

      const modal = document.getElementById('rmm-workout-modal');
      const card = document.getElementById('rmm-workout-modal-card');
      if (!modal || !card) return;

      const isAr = this.lang === 'ar';

      card.innerHTML = `
        <div class="rmm-modal-header">
          <div>
            <span class="rmm-region-tag">${ex.equipment.toUpperCase()} • ${ex.difficulty}</span>
            <h3>${isAr ? ex.nameAr : ex.name}</h3>
            <p>${isAr ? ex.name : ex.nameAr}</p>
          </div>
          <button type="button" class="rmm-modal-close" id="rmm-modal-btn-close">✕</button>
        </div>

        <form id="rmm-add-workout-form" class="rmm-modal-form">
          <div class="rmm-form-grid">
            <div class="rmm-form-field">
              <label>${isAr ? 'المجموعات (Sets):' : 'Sets:'}</label>
              <input type="number" id="rmm-input-sets" min="1" max="10" value="${ex.defaultSets || 3}" required />
            </div>
            <div class="rmm-form-field">
              <label>${isAr ? 'التكرارات (Reps):' : 'Reps:'}</label>
              <input type="text" id="rmm-input-reps" value="${ex.defaultReps || '8-10'}" required />
            </div>
            <div class="rmm-form-field">
              <label>${isAr ? 'الوزن المبدئي (Load kg):' : 'Initial Load (kg):'}</label>
              <input type="number" id="rmm-input-load" min="0" step="0.5" placeholder="e.g. 50" />
            </div>
            <div class="rmm-form-field">
              <label>${isAr ? 'معدل الجهد (RPE / RIR):' : 'RPE / RIR Target:'}</label>
              <input type="text" id="rmm-input-rpe" value="${ex.defaultRpe ? `RPE ${ex.defaultRpe}` : 'RIR 1-2'}" />
            </div>
            <div class="rmm-form-field">
              <label>${isAr ? 'فترة الراحة (Rest Sec):' : 'Rest (seconds):'}</label>
              <input type="number" id="rmm-input-rest" min="15" max="300" step="15" value="${ex.defaultRestSec || 90}" />
            </div>
            <div class="rmm-form-field">
              <label>${isAr ? 'الإيقاع الحركي (Tempo):' : 'Cadence / Tempo:'}</label>
              <input type="text" id="rmm-input-tempo" value="${ex.defaultTempo || '3-0-1-0'}" placeholder="e.g. 3-0-1-0" />
            </div>
          </div>

          <div class="rmm-form-field" style="margin-top: 12px;">
            <label>${isAr ? 'توجيهات التدريب والتكنيك:' : 'Coaching Cues & Notes:'}</label>
            <textarea id="rmm-input-cues" class="rmm-textarea" rows="2">${ex.biomech || ''}</textarea>
          </div>

          <div class="rmm-modal-footer">
            <button type="button" class="rmm-btn-secondary" id="rmm-modal-btn-cancel">${isAr ? 'إلغاء' : 'Cancel'}</button>
            <button type="submit" class="rmm-btn-primary">${isAr ? 'تأكيد الإضافة للجدول' : 'Confirm Add to Routine'}</button>
          </div>
        </form>
      `;

      modal.style.display = 'flex';

      const closeHandler = () => {
        modal.style.display = 'none';
      };

      const btnClose = card.querySelector('#rmm-modal-btn-close');
      const btnCancel = card.querySelector('#rmm-modal-btn-cancel');
      if (btnClose) btnClose.onclick = closeHandler;
      if (btnCancel) btnCancel.onclick = closeHandler;

      const form = card.querySelector('#rmm-add-workout-form');
      if (form) {
        form.onsubmit = (e) => {
          e.preventDefault();
          const item = {
            id: 'ex_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
            exerciseId: ex.id,
            name: ex.name,
            nameAr: ex.nameAr,
            equipment: ex.equipment,
            sets: Number(card.querySelector('#rmm-input-sets').value) || 3,
            reps: card.querySelector('#rmm-input-reps').value || '8-10',
            loadKg: Number(card.querySelector('#rmm-input-load').value) || null,
            rpe: card.querySelector('#rmm-input-rpe').value || '8',
            restSec: Number(card.querySelector('#rmm-input-rest').value) || 90,
            tempo: card.querySelector('#rmm-input-tempo').value || '3-0-1-0',
            notes: card.querySelector('#rmm-input-cues').value || ''
          };

          if (typeof this.onWorkoutAdd === 'function') {
            this.onWorkoutAdd(item, ex);
          } else {
            // Default global handler
            if (typeof window.addExerciseFromStudio === 'function') {
              window.addExerciseFromStudio(ex.id, this.selectedMuscleId);
            }
          }

          modal.style.display = 'none';
          this.showToast(isAr ? `تمت إضافة "${ex.nameAr}" لجدول التدريب بنجاح!` : `Added "${ex.name}" to workout program!`);
        };
      }
    }

    showToast(message) {
      if (typeof window.showToast === 'function') {
        window.showToast(message);
        return;
      }
      let toast = document.getElementById('rmm-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'rmm-toast';
        toast.className = 'rmm-toast-popup';
        document.body.appendChild(toast);
      }
      toast.textContent = message;
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 3200);
    }
  }

  // --- GLOBAL INTEGRATION APIS (Workout Builder & Application Interop) ---
  if (typeof window !== 'undefined') {
    window.openMuscleMap = function (opts = {}) {
      if (typeof window.switchTab === 'function') {
        window.switchTab('muscle-map');
      }
      setTimeout(() => {
        if (window.mainMuscleMap) {
          if (opts.athleteId) window.mainMuscleMap.setAthlete(opts.athleteId);
          if (opts.view) window.mainMuscleMap.switchView(opts.view);
          if (opts.muscleId) window.mainMuscleMap.selectMuscle(opts.muscleId);
          if (opts.exerciseId) window.mainMuscleMap.selectExercise(opts.exerciseId);
          if (opts.muscles) window.mainMuscleMap.highlightMuscles(opts.muscles);
        }
      }, 50);
    };

    window.highlightMuscles = function (muscles) {
      if (window.mainMuscleMap) {
        window.mainMuscleMap.highlightMuscles(muscles);
      }
    };

    window.selectMuscleMapExercise = function (exerciseId) {
      if (window.mainMuscleMap) {
        window.mainMuscleMap.selectExercise(exerciseId);
      }
    };
  }

  return MuscleMapEngine;
}));
  </script>

  <!-- 6. STANDALONE APPLICATION CONTROLLER -->
  <script id="rush-standalone-controller">

    let standaloneAthletes = [];
    let standaloneSelectedAthleteId = '';
    let standaloneEngine = null;

    function loadAthletes() {
      try {
        const raw = localStorage.getItem('rush_athletes_v2');
        if (raw) {
          standaloneAthletes = JSON.parse(raw);
        }
      } catch (e) {
        console.error('Error loading athletes:', e);
      }

      const select = document.getElementById('standalone-athlete-select');
      if (!select) return;

      let html = '<option value="">-- وضع الاستكشاف العام (مسودة حرة) --</option>';
      if (standaloneAthletes && standaloneAthletes.length > 0) {
        html += standaloneAthletes.map(ath => {
          const count = (ath.workoutPlan || []).length;
          return '<option value="' + ath.id + '">' + ath.name + ' (' + count + ' تمارين)</option>';
        }).join('');
      }
      select.innerHTML = html;
    }

    function onStandaloneAthleteChange() {
      const select = document.getElementById('standalone-athlete-select');
      standaloneSelectedAthleteId = select ? select.value : '';
      if (standaloneEngine) {
        standaloneEngine.setAthlete(standaloneSelectedAthleteId || null);
      }
    }

    function handleStandaloneAddExercise(exerciseOrItem, routineParams) {
      if (!exerciseOrItem) return;

      const exercise = exerciseOrItem.exerciseId ? exerciseOrItem : (routineParams || exerciseOrItem);
      const exName = exercise.nameAr || exercise.name || 'التمرين';

      if (standaloneSelectedAthleteId) {
        const athlete = standaloneAthletes.find(a => a.id === standaloneSelectedAthleteId);
        if (!athlete) return;

        if (!athlete.workoutPlan) athlete.workoutPlan = [];

        athlete.workoutPlan.push({
          id: 'plan_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
          exerciseId: exercise.exerciseId || exercise.id,
          name: exercise.name,
          nameAr: exercise.nameAr,
          sets: exercise.sets || (routineParams && routineParams.sets) || 3,
          reps: exercise.reps || (routineParams && routineParams.reps) || '8-12',
          load: exercise.loadKg || exercise.load || (routineParams && routineParams.load) || '',
          rpe: exercise.rpe || (routineParams && routineParams.rpe) || 8,
          rest: exercise.restSec || exercise.rest || (routineParams && routineParams.rest) || '90s',
          tempo: exercise.tempo || (routineParams && routineParams.tempo) || '3-0-1-0',
          targetHead: exercise.targetHead || '',
          volume: exercise.volume || '',
          equipment: exercise.equipment || '',
          biomech: exercise.biomech || exercise.notes || '',
          addedAt: new Date().toISOString()
        });

        localStorage.setItem('rush_athletes_v2', JSON.stringify(standaloneAthletes));
        loadAthletes();
        const select = document.getElementById('standalone-athlete-select');
        if (select) select.value = standaloneSelectedAthleteId;

        if (standaloneEngine && typeof standaloneEngine.showToast === 'function') {
          standaloneEngine.showToast('تمت إضافة "' + exName + '" لجدول ' + athlete.name + ' بنجاح!');
        }
      } else {
        if (standaloneEngine && typeof standaloneEngine.showToast === 'function') {
          standaloneEngine.showToast('تمت إضافة "' + exName + '" إلى مسودة التمارين بنجاح!');
        }
      }
    }

    function initStandaloneEngine() {
      loadAthletes();

      const MuscleMapConstructor = window.RushMuscleMap || (typeof RushMuscleMap !== 'undefined' ? RushMuscleMap : null);

      if (typeof MuscleMapConstructor !== 'function') {
        console.error('[RushMuscleMap] Failed to load RushMuscleMap constructor.');
        return;
      }

      try {
        standaloneEngine = new MuscleMapConstructor({
          containerId: 'rush-standalone-muscle-map',
          lang: 'ar',
          initialMode: 'selection',
          onExerciseAdd: (exercise, routineParams) => {
            handleStandaloneAddExercise(exercise, routineParams);
          }
        });
        console.log('✓ RushMuscleMap successfully initialized.');
      } catch (err) {
        console.error('[RushMuscleMap] Initialization error:', err);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initStandaloneEngine);
    } else {
      initStandaloneEngine();
    }

  </script>
